[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app fallback -- without this, refreshing on any route other
# than the root would 404 on Netlify's static file server. This app is
# currently single-route (step-based, not URL-routed), so this is a safety
# net rather than a fix for a known bug -- cheap to include, no downside.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# VITE_API_URL is intentionally NOT set here -- it must be added in the
# Netlify dashboard under Site settings -> Environment variables, since it
# points at your Render backend URL, which doesn't exist until you deploy
# Part 1 of the setup guide. Committing a real backend URL into this file
# would also make it harder to point staging vs production at different
# backends later.
